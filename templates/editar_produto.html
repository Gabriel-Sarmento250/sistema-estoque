{% extends 'base.html' %}
{% block content %}
<h2>Editar Produto</h2>

<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label>Nome</label>
        <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" required>
    </div>
    <div class="col-md-6">
        <label>Categoria</label>
        <select name="categoria_id" class="form-select">
            <option value="">Sem categoria</option>
            {% for c in categorias %}
            <option value="{{ c.id }}" {% if produto.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label>Quantidade</label>
        <input type="number" name="quantidade" class="form-control" value="{{ produto.quantidade }}">
    </div>
    <div class="col-md-4">
        <label>Preço</label>
        <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco }}">
    </div>
    <div class="col-md-4">
        <label>Estoque mínimo</label>
        <input type="number" name="estoque_minimo" class="form-control" value="{{ produto.estoque_minimo }}">
    </div>
    <div class="col-12">
        <button class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('produtos') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
